<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サポート｜よふかし</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg:#0E1430; --card:#182046; --text:#EEF0F8; --sub:#C9CEE4; --muted:#A7AFCF; --border:#2C3668; --accent:#F4B860; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.8; }
main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
header img { width:48px; height:48px; border-radius:11px; }
header a { color:var(--text); text-decoration:none; font-weight:700; font-size:18px; }
h1 { font-size:24px; margin:0 0 8px; }
h2 { font-size:16px; margin:28px 0 6px; }
p { margin:0 0 6px; color:var(--sub); font-size:15px; }
p.item { padding-left:1em; }
.date { color:var(--muted); font-size:13px; margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:20px; }
.links a { display:block; padding:12px 0; color:var(--accent); text-decoration:none; font-weight:600; border-top:1px solid var(--border); }
.links a:first-child { border-top:none; }
a { color:var(--accent); word-break:break-all; }
footer { margin-top:40px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><a href="./">よふかし</a></header>

<div class="card links">
<a href="terms.html">利用規約</a>
<a href="privacy.html">プライバシーポリシー</a>
</div>
<div class="card">

<p><a href="mailto:amaneko.support+yofukashi@gmail.com">amaneko.support+yofukashi@gmail.com</a></p>

</div>
<footer>© よふかし運営事務局</footer>
